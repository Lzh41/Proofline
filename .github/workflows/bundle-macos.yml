name: 构建 macOS 安装包

# macOS 的 .app / .dmg 只能在 macOS 上编译链接，Windows 出不了包。
# 所以用 GitHub 的 macOS runner（Apple Silicon）编，产物自动挂到指定的 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 挂到哪个 Release tag
        required: true
        default: v0.1.19
      arch:
        description: 目标架构
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - universal

permissions:
  contents: write

jobs:
  bundle:
    name: macOS ${{ inputs.arch }}
    runs-on: macos-latest
    # 与 ci.yml 的 macOS 检查共用并发组，串行排队而不是互相抢占 runner。
    concurrency:
      group: macos-runner
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.arch == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建 .app 与 .dmg
        run: |
          set -e
          if [ "${{ inputs.arch }}" = "universal" ]; then
            npm run tauri:build:mac-universal
          else
            npm run tauri:build:mac
          fi

      - name: 把 .app 打成 zip
        # dmg 在某些下载器/代理下会被改写，挂载失败时用这个包直接解压即可。
        # ditto 会保留符号链接与权限，比 zip -r 更适合打 .app。
        run: |
          set -e
          APP=$(find src-tauri/target -maxdepth 8 -name 'Proofline.app' -print | head -n1)
          if [ -z "$APP" ]; then echo "没有找到 Proofline.app"; exit 1; fi
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          echo "打包 $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Proofline_${VER}_${{ inputs.arch }}-app.zip"

      - name: 列出产物
        run: |
          set -e
          find src-tauri/target -maxdepth 7 -name '*.dmg' -exec ls -lh {} \;
          ls -lh ./*.zip

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: proofline-macos-${{ inputs.arch }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            Proofline_*.zip
          if-no-files-found: error

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Proofline ${TAG#v}" --notes "macOS 安装包"
          for file in $(find src-tauri/target -name '*.dmg' -path '*release/bundle/dmg/*') ./*.zip; do
            echo "上传 $file"
            gh release upload "$TAG" "$file" --clobber
          done
