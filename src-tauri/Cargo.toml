[package]
name = "proofline"
version = "0.1.2"
description = "Proofline - 从题目推导到可验证解法的算法学习工作台"
authors = ["Proofline contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "proofline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "proofline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
dirs = "6.0.0"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled-full"] }
dom_query = { version = "0.27.0", default-features = false }
html5ever = "0.38.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.9.0", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-window-state = "2.4.0"
tempfile = "3.21.0"
tendril = "0.5.0"
tokio = { version = "1.47.1", features = ["macros", "sync", "time"] }
tokio-util = "0.7.16"
url = "2.5.7"
uuid = { version = "1.18.0", features = ["v4", "serde"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
